name: fintrack
description: Personal finance management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter 

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.1.0

  # Navigation
  go_router: ^14.2.0

  # UI & Chart
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.19.0                # format Rupiah & tanggal
  image_picker: ^1.1.2         # upload foto profil
  shared_preferences: ^2.2.3   # flag onboarding sudah dilihat
  uuid: ^4.4.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3  
  flutter_launcher_icons: ^0.14.1           # untuk unit test use case (Fase Testing nanti)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F5132"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/